<div class="dashboard-conteiner">
    <div class="sidebar-layer">
        <app-logs #logs (openUpload)="isUploadOpen = true" (tripSelected)="selectedId = $event"></app-logs>
    </div>

    <app-map class="map-layer" [tripId]="selectedId" (point)="selectedPoint = $event"></app-map>


    @if (isUploadOpen) {
        <div class="upload-layer">
            <app-upload 
            (uploadCompleted)="isUploadOpen = false; logs.reloadLogs()" 
            (close)="isUploadOpen = false"></app-upload>
        </div>

    }

    @if (selectedPoint) {
        <div class="detail-layer">
            <app-point-detail
                [pnt]="selectedPoint"
                (closeDetail)="selectedPoint = null">
            </app-point-detail>
        </div>
    }
</div>
